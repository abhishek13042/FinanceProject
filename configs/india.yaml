# NIFTY-100 / Indian-market instantiation of the hierarchical-LLM + patch + co-attention model
data:
  universe_file: data/raw/universe50.csv     # cols: symbol, sector. Sector-stratified from NIFTY 100.
  suffix: ".NS"                              # NSE via yfinance; use ".BO" for BSE
  start: "2018-01-01"
  end: "2025-12-31"
  price_csv: data/interim/prices.csv
  news_csv: data/raw/news.csv                # columns: symbol,timestamp,headline,body
  summary_csv: data/interim/daily_summaries.csv
  embed_npz: data/interim/daily_embeddings.npz
  option_features: data/interim/option_features.csv   # src/data/options.py (opt_* ablations)
  # chronological split (no look-ahead), same 62.5/12.5/25 proportions as the paper
  train_end: "2022-12-31"   # 1,234 days = 62.5% of 1,975 (paper proportions; see spec 05 R1)
  val_end:   "2023-12-31"
  test_end:  "2025-12-31"
  max_missing_frac: 0.05
  ffill_max_gap: 3
  sigma_clip: 3.0
  filter_boilerplate: true   # drop administrative filings (see news_sources.BOILERPLATE)
  dedup_ratio: 0.90
  min_chars: 50
  min_body_chars: 30         # drop filings whose body is an empty attachment stub (60.2%
                             # of post-boilerplate rows); see build_text.load_news

market:                                       # India-specific
  tz: "Asia/Kolkata"
  session_start: "09:15"
  session_end: "15:30"
  hourly_buckets: 7                           # pre-open + 6 intraday + post-close bucket
  circuit_pct: 20.0                           # NSE price band; clip returns beyond this

summarizer:
  # Generation. mT5-XLSum (the original choice) is fine-tuned on BBC articles and substitutes
  # entities it knows for ones it does not: on 8 real filings it named the correct company
  # 2/8 and invented "Scottish Stock Exchange" / "Bank of England". Qwen2.5-1.5B-Instruct
  # scored 8/8 with correct dates and amounts, at 3.2 GB and ~1.5 GPU-hours for the backfill.
  model: "Qwen/Qwen2.5-1.5B-Instruct"
  causal: true                                # decoder-only: chat template, left padding
  # Embedding stays mT5, so x_e keeps d = 768 and nothing downstream moves. Never resident at
  # the same time as the generator - see HierarchicalSummarizer._embedder.
  embed_model: "csebuetnlp/mT5_multilingual_XLSum"
  max_input_tokens: 1024
  embed_max_tokens: 512
  max_summary_tokens: 84
  daily_summary_tokens: 128
  batch_size: 16            # measured: 1.7 GPU-hrs at 4.24 GB peak of 6.4 (32 is 1.5 hrs
                            # but 4.8+ GB; throughput only, does not affect the result)
  device: "cuda"

model:
  seq_len: 30            # L
  patch_len: 10          # P
  stride: 5              # S
  d_model: 128
  d_ff: 256
  n_layers: 4
  n_heads: 8
  dropout: 0.2
  activation: "gelu"
  n_price_feats: 17      # 6 OHLCV-family + 11 technical indicators (paper Table 4);
                         # set from the feature list at load time (33 with use_options)
  use_options: false     # append the 16 option-chain channels (opt_* ablations)
  text_dim: 768          # mT5-base encoder width
  d_align: 17            # d_a: shared text/price alignment width. 17 == paper (Eq. 1).
                         # Widen (32/64) to relieve the 768->17 squeeze; costs ~d_a/17x
                         # encoder compute on BOTH streams. Ablation axis, see spec 05.

train:
  epochs: 20
  batch_size: 16
  lr: 1.0e-4
  lr_decay: 1.0e-4
  decay_every: 5
  patience: 5
  seed: 42
  out_dir: artifacts
